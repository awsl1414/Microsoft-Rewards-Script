name: Build and Push Docker Image

on:
  push:
    branches: [ v2 ]
  pull_request:
    branches: [ v2 ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v2  # 确保检出 v2 分支

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3  # 支持 ARM 等多平台构建

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}  # PR 时仅构建，不推送
          tags: ${{ vars.DOCKERHUB_USERNAME }}/ms-rewards-script:v2
          platforms: linux/amd64,linux/arm64  # ARM64 支持
          provenance: true
          sbom: true  # 生成 SBOM
          cache-from: type=gha
          cache-to: type=gha,mode=max